<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Math Object Calculator</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container{
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            text-align: center;
        }

        h2{
            color: darkblue;
        }

        input{
            width: 90%;
            padding: 10px;
            margin: 15px 0;
            font-size: 16px;
        }

        button{
            width: 130px;
            padding: 10px;
            margin: 5px;
            font-size: 15px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkblue;
        }

        #result{
            margin-top:20px;
            font-size:20px;
            color:green;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="container">

    <h2>Math Object Calculator</h2>

    <input type="number" id="num" placeholder="Enter a Number">

    <br>

    <button onclick="roundNum()">Round</button>
    <button onclick="sqrtNum()">Square Root</button>

    <button onclick="powerNum()">Power</button>
    <button onclick="absNum()">Absolute</button>

    <h3 id="result"></h3>

</div>

<script>

function roundNum()
{
    let n = Number(document.getElementById("num").value);
    document.getElementById("result").innerHTML =
    "Rounded Value = " + Math.round(n);
}

function sqrtNum()
{
    let n = Number(document.getElementById("num").value);
    document.getElementById("result").innerHTML =
    "Square Root = " + Math.sqrt(n);
}

function powerNum()
{
    let n = Number(document.getElementById("num").value);
    document.getElementById("result").innerHTML =
    "Power (n²) = " + Math.pow(n,2);
}

function absNum()
{
    let n = Number(document.getElementById("num").value);
    document.getElementById("result").innerHTML =
    "Absolute Value = " + Math.abs(n);
}

</script>

</body>
</html>
